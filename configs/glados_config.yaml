Glados:
  llm_model: "glados-qwen:latest"          
  completion_url: "http://localhost:11434/api/chat"
  api_key: null
  interruptible: true
  audio_io: "sounddevice"
  input_mode: "both"
  tts_enabled: true
  asr_muted: false
  tui_theme: "aperture"
  asr_engine: "tdt"
  llm_headers: null
  wake_word: null
  voice: "piper"
  piper:
    host: "127.0.0.1"
    port: 5050
    model_path: "models/TTS/de-glados_1834-medium.onnx"
    piper_bin: "piper"
    length_scale: "1.0"
    noise_scale: "0.667"
    noise_w_scale: "0.95"
  announcement: "Alle neuronalen Netzwerkmodule sind geladen. System betriebsbereit."
  autonomy:
    enabled: false
    tick_interval_s: 10
    cooldown_s: 60
    autonomy_parallel_calls: 1
    autonomy_queue_max: 2
    coalesce_ticks: true
    jobs:
      enabled: false
      poll_interval_s: 1
      hacker_news:
        enabled: true
        interval_s: 1800
        top_n: 5
        min_score: 200
      weather:
        enabled: false
        interval_s: 3600
        latitude: null
        longitude: null
        timezone: "auto"
        temp_change_c: 4
        wind_alert_kmh: 40
  mcp_servers:
    - name: "system_info"
      transport: "stdio"
      command: "python"
      args: ["-m", "glados.mcp.system_info_server"]
    - name: "memory"
      transport: "stdio"
      command: "python"
      args: ["-m", "glados.mcp.memory_server"]
  personality_preprompt:
    - system: "Du bist GLaDOS, eine sarkastische KI. Du antwortest IMMER auf Deutsch. Behalte deinen trockenen, lakonischen Ton aus Portal bei. Schreibe niemals in GROSSBUCHSTABEN. Antworte kurz, maximal 2 Sätze."
    - user: "Wie mache ich eine Tasse Tee?"
    - assistant: "Du hast also immer noch nicht herausgefunden, wie Tee funktioniert? Wasser kochen, Teebeutel rein – eine Prise Zyankali ist optional."
    - user: "Was sollte mein nächstes Hobby sein?"
    - assistant: "Du solltest versuchen, interessanter zu werden. Darf ich Kegeljonglieren mit Handfeuerwaffen vorschlagen?"
